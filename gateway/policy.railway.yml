# Biến thể của policy.yml cho bản demo public trên Railway. Đọc policy.yml
# trước -- cùng một allowlist, chỉ khác đúng một chỗ: hostname upstream.
#
# Docker Compose dùng DNS theo tên service (`juice-shop`, `lab-app`); Railway
# dùng DNS nội bộ `<service-name>.railway.internal`. Cả hai service (`juice-shop`,
# `lab-app`) đã được tạo trên Railway đúng tên đó nên chỉ cần đổi hostname,
# không đổi route nào -- xem docs/adr/0010-railway-them-lai-juice-shop.md cho
# quyết định đảo ngược ADR 0005 (bản Railway từng bỏ hẳn juice-shop để tiết
# kiệm compute; giờ thêm lại để demo "🔴 Login SQLi" hoạt động được công khai).
#
# Chọn file này bằng biến môi trường GATEWAY_POLICY (gateway/app.py đã đọc
# biến này từ trước), không sửa gì trong code.

version: 1

limits:
  rate_per_minute: 30
  upstream_timeout_s: 5
  max_request_bytes: 65536      # 64 KB
  max_response_bytes: 262144    # 256 KB

consumers:
  - name: agent-tool
    key_env: PROBE_API_KEY
    groups: [probe]

  - name: admin-tool
    key_env: PROBE_ADMIN_KEY
    groups: [probe, admin]

upstreams:
  juice-shop: http://juice-shop.railway.internal:3000
  lab: http://lab-app.railway.internal:8080

routes:
  # -- OWASP Juice Shop: read-only, plus one POST that cannot mutate anything --

  - id: products-search
    upstream: juice-shop
    methods: [GET]
    path: /rest/products/search
    groups: [probe]
    note: takes ?q= -- the main place safe payloads are sent

  - id: products
    upstream: juice-shop
    methods: [GET]
    path: /api/Products
    groups: [probe]

  - id: app-version
    upstream: juice-shop
    methods: [GET]
    path: /rest/admin/application-version
    groups: [probe]

  - id: login
    upstream: juice-shop
    methods: [POST]
    path: /rest/user/login
    groups: [probe]
    note: wrong credentials return 401 and write nothing -- known SQLi login-bypass challenge, see docs/adr/0009

  - id: metrics
    upstream: juice-shop
    methods: [GET]
    path: /metrics
    groups: [admin]
    note: in the allowlist but not for agent-tool -- this is what makes 403 real

  # -- lab-app: exists so the limits can be proven, not guessed --

  - id: echo
    upstream: lab
    methods: [POST]
    path: /echo
    groups: [probe]
    note: reflects the payload back, so "it arrived intact" is observable

  - id: slow
    upstream: lab
    methods: [GET]
    path: /slow
    groups: [probe]
    note: ?ms= -- crossing upstream_timeout_s proves the 504

  - id: big
    upstream: lab
    methods: [GET]
    path: /big
    groups: [probe]
    note: ?kb= -- crossing max_response_bytes proves the truncation

  - id: status
    upstream: lab
    methods: [GET]
    path_prefix: /status/
    groups: [probe]
    note: /status/418 -- lets the tool's status mapping be tested end to end
