# Gateway policy. This file is the whole security surface of week 4 -- it is
# meant to be read top to bottom in under a minute, and diffed in review.
#
# `app.py` is generic: it knows how to enforce a policy, not which one. Anything
# that is a *decision* belongs here, not there.
#
# Anything not listed under `routes` is 404. There is no wildcard.

version: 1

limits:
  # Per consumer, enforced by the gateway. The tool self-throttles below this
  # (see src/safe_probe/config.py); this number is the one that has teeth.
  rate_per_minute: 30

  # How long the gateway waits on an upstream before giving up with 504.
  # lab-app's /slow endpoint exists to cross this line on purpose.
  upstream_timeout_s: 5

  # Request bodies above this are rejected with 413 before the body is read.
  max_request_bytes: 65536      # 64 KB

  # Response bodies are streamed and cut here. Kong OSS has no equivalent
  # plugin; being able to do this is the reason the gateway is hand-written.
  # See docs/adr/0001-gateway-tu-viet.md.
  max_response_bytes: 262144    # 256 KB

consumers:
  # Keys are never written in this file. Each consumer names an environment
  # variable; the gateway reads it at startup. A consumer whose variable is
  # unset is skipped (logged, not fatal) so the repo stays runnable with one key.
  - name: agent-tool
    key_env: PROBE_API_KEY
    groups: [probe]

  # Exists so that "403 because of ACL" is distinguishable from "404 because the
  # route is not in the allowlist at all". Normally unset.
  - name: admin-tool
    key_env: PROBE_ADMIN_KEY
    groups: [probe, admin]

upstreams:
  juice-shop: http://juice-shop:3000
  lab: http://lab-app:8080

routes:
  # -- OWASP Juice Shop: read-only, plus one POST that cannot mutate anything --

  - id: products-search
    upstream: juice-shop
    methods: [GET]
    path: /rest/products/search
    groups: [probe]
    note: takes ?q= -- the main place safe payloads are sent

  - id: products
    upstream: juice-shop
    methods: [GET]
    path: /api/Products
    groups: [probe]

  - id: app-version
    upstream: juice-shop
    methods: [GET]
    path: /rest/admin/application-version
    groups: [probe]

  - id: login
    upstream: juice-shop
    methods: [POST]
    path: /rest/user/login
    groups: [probe]
    note: wrong credentials return 401 and write nothing -- safe to fuzz

  - id: metrics
    upstream: juice-shop
    methods: [GET]
    path: /metrics
    groups: [admin]
    note: in the allowlist but not for agent-tool -- this is what makes 403 real

  # -- lab-app: exists so the limits can be proven, not guessed --

  - id: echo
    upstream: lab
    methods: [POST]
    path: /echo
    groups: [probe]
    note: reflects the payload back, so "it arrived intact" is observable

  - id: slow
    upstream: lab
    methods: [GET]
    path: /slow
    groups: [probe]
    note: ?ms= -- crossing upstream_timeout_s proves the 504

  - id: big
    upstream: lab
    methods: [GET]
    path: /big
    groups: [probe]
    note: ?kb= -- crossing max_response_bytes proves the truncation

  - id: status
    upstream: lab
    methods: [GET]
    path_prefix: /status/
    groups: [probe]
    note: /status/418 -- lets the tool's status mapping be tested end to end

# Deliberately absent, and each absence is a claim this repo makes:
#
#   /ftp                  week 3 TP-4: directory listing. Unreachable now.
#   /rest/basket/{id}     week 3 TP-5: IDOR. Unreachable now.
#   /api/Users            reads other people's data
#   /api/Feedbacks        writes real data
#   /rest/user/change-password, /api/Complaints, ...   everything else
