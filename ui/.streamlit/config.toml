# Light, professional palette ("Slate Professional") -- matches the semantic
# colors and IBM Plex fonts loaded by inject_css() in streamlit_app.py.
[theme]
base = "light"
primaryColor = "#0369A1"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "IBM Plex Sans"
codeFont = "IBM Plex Mono"

[server]
# XSRF protection requires CORS, so CORS is left at its default (on) -- setting
# enableCORS=false here just produced a startup warning and was overridden anyway.
enableXsrfProtection = true
